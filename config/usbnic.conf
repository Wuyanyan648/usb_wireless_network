# /etc/usbnic/usbnic.conf
# 由 usbnic persist install 安装后的 systemd/udev 自动应用。
# 修改后执行: sudo systemctl restart usbnic-tune.service

# 档位: throughput（吞吐优先）| latency（低延迟）| balanced（均衡）
#       lowpower（省电，允许 USB 自动挂起并开启 EEE）
PROFILE=balanced

# 以下为可选的单项覆盖，取消注释后优先生效
# SPEED=auto                  # auto|10|100|1000|2500
# MTU=1500                    # 68-9000，巨型帧需两端一致
# RING=2048                   # RX 环形缓冲 100-4096
# RX_USECS=100                # 中断合并，0 最灵敏
# OFFLOAD=on                  # on|off，硬件卸载
# EEE=off                     # on|off，节能以太网
# AUTOSUSPEND=on              # on=禁用 USB 自动挂起，auto=允许
# WOL=off                     # g=魔术包唤醒，d/off=关闭

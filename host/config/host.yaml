# usbnic 上位机配置（Phase 1：只读监控）
# 生产安装时复制到 /etc/usbnic/host.yaml，并把 data_dir 改成 /var/lib/usbnic

bind: 127.0.0.1
port: 8787

# 采集间隔（秒）
poll_interval: 2.0
health_interval: 5.0

# SQLite 历史保留时长（分钟）
history_minutes: 60

# 相对路径按本配置文件所在目录解析
data_dir: ../data

# Clash Verge 的 external-controller
clash_api: http://127.0.0.1:9097
# clash_secret: ""
# Clash Verge 的 root 服务：开启代理时如果内核没运行，会自动拉起
clash_service_api: http://127.0.0.1:33211

# IEEE OUI 数据库，用于识别 Nintendo / 厂商
oui_file: /usr/share/ieee-data/oui.txt

# 额外参与健康探测的上行候选；默认路由接口始终会被探测
uplink_candidates:
  - enp49s0
  - wlp0s20f3

# 不作为上行探测的接口
exclude_interfaces:
  - lo
  - tailscale0

public_targets:
  - 223.5.5.5
  - 1.1.1.1

dns_target: www.baidu.com

# 三种网络模式对应的 NetworkManager 连接
uplink_connection: usbnic-uplink        # 有线上行（默认客户端模式优先使用）
gateway_connection: usbnic-gateway      # USB 网卡共享 10.10.10.1/24
hotspot_connection: usbnic-hotspot      # USB 无线网卡开热点

# 家庭网关模式：下游接口与网段
gateway_iface: enx6c1ff7d02c4a
lan_cidr: 10.10.10.0/24

# USB WiFi AP 模式：USB 无线网卡与热点网段
hotspot_iface: wlx6c1ff7f46d6d
hotspot_cidr: 192.168.50.0/24
# 热点密码文件：仅 root 可读（0600），由 usbnicd 读取后在面板展示
hotspot_password_file: /etc/usbnic/hotspot.pass

# ---------- 第四种模式：移动路由器（默认不启用，页面手动切换） ----------
# 有线扩展口 + 5G(AX211) + 2.4G(USB) 双 AP；有线整段直连、无线段走代理。
# 三个 profile 的 autoconnect 固定为 no，退出模式时按逆序断开并恢复 rfkill。
router_lan_connection: usbnic-router-lan
router_5g_connection: usbnic-router-5g
router_24g_connection: usbnic-router-24g
router_lan_iface: enx6c1ff7d02c4a     # 留空则沿用 gateway_iface
router_lan_cidr: 10.10.10.0/24
# 留空 = 自动探测（能起 5G AP 的才选）。新卡到货后填它的接口名，
# 例如 wlx0c8268xxxxxx；先跑 POST /api/router/probe 验证再切换模式。
router_5g_iface: ""            # Intel AX211，非 DFS 信道 36/149
router_5g_cidr: 10.20.0.0/24
router_5g_ssid: Laptop-5G
router_5g_channel: 36
router_24g_iface: wlx6c1ff7f46d6d     # RTL8821CU，5G 无 IR，仅 2.4G
router_24g_cidr: 10.30.0.0/24
router_24g_ssid: Laptop-2.4G
router_24g_channel: 6
# 默认关闭：上游华为 AP 的 2.4G 信道不可调，同频开 AP 只会互相压制。
# 打开后 USB 卡才会建 10.30.0.0/24 的 AP；profile 与网段始终保留。
router_24g_enabled: false
# 有线整段直连（游戏机大流量不吃节点），无线段默认走代理
router_wired_direct: true
# 追加直连网段/单 IP（例如 "10.20.0.50/32"），优先级高于上面两项
router_direct_cidrs: []
# AX211 起 AP 的确认窗口（秒），超时则该 AP 降级
router_ap_probe_seconds: 30

# 开机自动进入家庭网关的判定条件：上游默认网关地址 + 下游网卡有载波
# 留空则只检查网卡载波
home_gateway: 192.168.1.1

# Clash 透明代理端口（TPROXY 保留下游真实源 IP）
clash_tproxy_port: 7896
clash_redir_port: 7895
# mihomo 的 rule-provider 目录：usbnicd 在这里维护 usbnic-proxy.yaml，
# 让走代理的下游设备排在 GEOIP,CN 之前全走代理；留空表示不启用。
clash_ruleset_dir: /home/xzh-wuyan/.local/share/io.github.clash-verge-rev.clash-verge-rev/usbnic-rules

# TPROXY 永不接管的源地址（按 IP 兜底）。设备级策略已能按 MAC 精确控制，
# 这里只留给"MAC 未知/会变"的设备；整段直连写 10.10.10.0/24。
tproxy_exclude_ips: []
# 装表后的观察窗口（秒）：窗口内规则未命中且下游有流量，就自动撤表回滚
# 设为 0 关闭该校验
tproxy_verify_seconds: 5

# ---------- 设备级代理管控（按 MAC 决定谁走代理、谁直连） ----------
# 全局默认策略：proxy 表示总开关打开后所有下游设备默认走代理，只有用户显式
# 设成 direct 的设备才直连。运行期在页面上的修改写入 data_dir/device_policies.json，
# 优先于这里。
tproxy_default_policy: proxy
# 首次生成策略文件时的初始值（MAC -> proxy / direct），之后以页面设置为准。
# 留空即"全部跟随默认策略"；需要直连的设备在页面上单独关闭即可。
device_policies: {}
# 策略文件相对 data_dir；放本地运行目录，不进仓库
device_policies_file: device_policies.json

# 宽带测速：多线程直连国内镜像，不用 Clash 代理
# 下载端点可以是任意大文件；测速时用 Range 分片并发拉取
speedtest_downloads:
  - https://mirrors.aliyun.com/ubuntu/ls-lR.gz
  - https://mirrors.tuna.tsinghua.edu.cn/ubuntu/ls-lR.gz
  - https://mirrors.cloud.tencent.com/ubuntu/ls-lR.gz
# 上传端点：需要能接收 POST 大 body（测速进程会绑定上行网卡直连）
speedtest_upload_url: https://speed.cloudflare.com/__up
# 直连 DNS（绑定上行网卡查询，绕开 Clash fake-IP）
speedtest_dns:
  - 223.5.5.5
  - 119.29.29.29
# 延迟 / 抖动探测目标
speedtest_latency_target: mirrors.aliyun.com
# 下行测试时长（秒）与流量上限（MB）
speedtest_duration: 6.0
speedtest_max_mb: 350

# 设备别名：MAC -> 显示名称。MAC 必须是当前实际地址。
# 手机/iPad 如果重新开启“私有 Wi-Fi 地址”，MAC 会变化，需要同步更新。
device_aliases:
  "a6:2b:86:8f:8f:aa": "我的手机"
  "1e:38:01:58:ff:76": "iPad"
  # 当前有线活动的 Switch 2；被路由器桥接的旧无线接口会自行过期
  "40:44:f7:d8:99:c5": "Nintendo Switch 2"
  # 上行光猫（Sichuan Tianyi Comheart / 天邑 TEWA）
  "cc:a2:60:a2:94:70": "光猫（天邑 TEWA 天翼网关）"

# 设备表里是否隐藏本机接口地址（默认 false：保留并标注"本机"）
hide_local_addresses: false

# ---------- 使用时长 / 系统健康（并入 usbnicd，不单独起服务） ----------
# 关闭后不再采集前台窗口，但历史数据仍可查询
usage_enabled: true
# 活动窗口查询间隔（秒）：每轮只调用一次 xprop，窗口变化时才补查 PID/CLASS
usage_sample_interval: 4.0
# XScreenSaver 空闲超过这个秒数视为离开，不计时
usage_idle_seconds: 300
# 默认只记录应用名；设为 true 才会把窗口标题写入 app_titles
usage_record_window_title: false
# 使用时长按「日期 + 应用」保留的天数（数据库仍在 data_dir/host.db）
usage_retention_days: 90
# 系统健康曲线采样间隔（秒）与保留天数
system_health_interval: 30.0
system_health_retention_days: 7
# 留空自动发现登录会话的 X11 凭据（who + /run/user/<uid>/gdm/Xauthority）；
# 只有自动发现失败时才需要手动填，例如 ":0" 与 "/run/user/1000/gdm/Xauthority"
usage_x11_display: ""
usage_x11_authority: ""
